# Run Helm-based tests in CI using a Kind (Kubernetes in Docker) cluster.
# The runner has Docker pre-installed; Kind creates a disposable cluster; no AWS/EKS.

name: Run tests (Kind)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  KIND_CLUSTER_NAME: minimus-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: latest
        id: install

      - name: Add Bitnami Helm repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run tests
        run: pytest --kube-context=kind-${{ env.KIND_CLUSTER_NAME }}
