[pytest]
# K8s Helm Image Validation – test infrastructure
# Generic Helm-based image validation framework
#
# Configuration is defined inside each test class (not via CLI flags).
# The only CLI option is --kube-context to select the Kubernetes cluster.
#
# Usage:
#   pytest --kube-context=kind-k8s-validation-test
#   pytest tests/test_postgresql_bugs.py --kube-context=docker-desktop

testpaths = tests
addopts = -v -s --tb=short --alluredir=allure-results --clean-alluredir

# Custom markers (aligned with docs/TEST_REPORT.md)
markers =
    helm: Helm/Kubernetes deployment tests
    defect: Reproduces or documents a known defect (DEF-01, DEF-02)
    critical: P0/Critical defect – causes failure on Docker (DEF-01, DEF-02)
    warning: Defect visible but non-fatal in this environment (e.g. DEF-02 on K8s: error in logs, pod still starts)
    env_difference: Documents Docker vs K8s behavioral difference (e.g. SEC-02: PVC masks DEF-01)
